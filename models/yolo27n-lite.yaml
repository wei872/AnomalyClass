# =============================================================================
# YOLO27n-Lite — Extreme Edge-Lightweight Variant for Fabric Inspection Cameras
#
# Retains ALL core YOLO27n innovations (widened early P2/4 & P3/8 stages,
# dual-scale [P3/8, P5/32] head with fixed + folded feature scaling, DFL-free
# unconstrained reg_max=1 regression, and training-only Foreground Alignment
# Supervision), while compressing deeper stages via SCDown and [0.50, 0.1875, 768].
#
# Complexity @ 640x640 (Fused, nc=19):
#   - Parameters: ~0.77M — 68% fewer params than YOLO26n!
#   - FLOPs:      ~3.14 GFLOPs — 41% lower compute than YOLO26n!
# =============================================================================

nc: 19
scale: n
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.1875, 768]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2   (standard stem conv for raw RGB fidelity)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [384, False, 0.25]]  # 2-P2/4   widened early high-res stage (72 ch vs 48 ch)
  - [-1, 1, SCDown, [256, 3, 2]]       # 3-P3/8   pointwise + depthwise separable downsample
  - [-1, 2, C3k2, [512, False, 0.50]]  # 4-P3/8   2x inner bottleneck small-object stage
  - [-1, 1, SCDown, [512, 3, 2]]       # 5-P4/16  separable downsample
  - [-1, 2, C3k2, [640, True]]         # 6-P4/16
  - [-1, 1, SCDown, [768, 3, 2]]       # 7-P5/32  separable downsample
  - [-1, 2, C3k2, [768, True]]         # 8-P5/32
  - [-1, 1, SPPF, [768, 5, 3, True]]   # 9-P5/32
  - [-1, 1, C2PSA, [768]]              # 10-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]                 # 13: top-down P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [320, True]]                 # 16: P3/8-fine prediction map

  - [-1, 1, SCDown, [320, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]                 # 19: bottom-up P4 relay

  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, True, 0.5, True]]      # 22: P5/32-coarse prediction map

  - [[16, 22], 1, Detect, [nc]]                # 23: Dual-Scale Detect(P3/8, P5/32)
