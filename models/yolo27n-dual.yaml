# =============================================================================
# YOLO27n-Dual — Pure Dual-Scale [P3/8, P5/32] Configuration (Official YOLO27 N/S)
# Reference: https://docs.ultralytics.com/zh/models/yolo27
#
# Drops the medium P4/16 detection head to save head compute while keeping PAN
# feature relay, widened P2/P3 small-object stages, fixed (1.0, 1/sqrt(2)) +
# folded feature scaling, and training-only Foreground Alignment Supervision.
#
# Complexity @ 640x640 (Fused, nc=19):
#   - Parameters: ~2.46M (virtually identical to YOLO26n's 2.38M!)
#   - FLOPs:      ~6.21 GFLOPs (6,800 anchors vs 8,400 anchors)
# =============================================================================

nc: 19
scale: n
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2   (320x320)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4   (160x160)
  - [-1, 2, C3k2, [320, False, 0.25]]  # 2-P2/4   widened high-res stage (80 ch)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8   (80x80)
  - [-1, 2, C3k2, [512, False, 0.50]]  # 4-P3/8   2x inner bottleneck small-object stage
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16  (40x40)
  - [-1, 2, C3k2, [512, True]]         # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32  (20x20)
  - [-1, 2, C3k2, [1024, True]]        # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]]  # 9-P5/32
  - [-1, 2, C2PSA, [1024]]             # 10-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]                 # 13: top-down P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [320, True]]                 # 16: P3/8-fine prediction map (80 ch -> c3=80)

  - [-1, 1, Conv, [320, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]                 # 19: bottom-up P4 semantic relay

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]     # 22: P5/32-coarse prediction map (256 ch, 1:1 with yolo26n.pt)

  - [[16, 22], 1, Detect, [nc]]                # 23: Dual-Scale YOLO27Detect(P3/8, P5/32)
