# =============================================================================
# Ultralytics YOLO27 Fabric-Enhanced Architecture (N / S scales)
# Reference: https://docs.ultralytics.com/models/yolo27
# Dataset default: dataset/fabric19.yaml (19 fabric defect classes)
#
# Key Architectural Enhancements over Pure YOLO26n for Fabric Defect Detection:
#   1. 16-Bin Distribution Focal Loss (reg_max: 16) + Dual-Mode Detection Head:
#      Restores 16-bin sub-pixel boundary probability regression (c2=64 box head
#      + DFL loss) alongside YOLO27's one-to-many + NMS default inference and
#      parallel one-to-one (nms=False) export capability (~2.74M fused params /
#      ~7.00 GFLOPs @ nc=19, well inside official YOLO27n 3.0M / 7.2B specs).
#   2. Widened Early High-Resolution Stages:
#      P2/4 C3k2 widened (256 -> 320, +25%) + P3/8 fine neck widened (256 -> 288, +12.5%)
#      with function-preserving Net2Wider warm-start from yolo26n.pt (<1e-6 step-0 error)
#      to capture tiny defects (蚊虫小黑点 / 经线毛球 / 小尾巴).
#   3. Full Multi-Scale Feature Preservation:
#      Retains P3/8 + P4/16 + P5/32 so tiny point defects, medium stains, and
#      full-width warp/weft defects (纬斜 / 稀缝 / 断纬) are localized smoothly.
#   4. Foreground Alignment Supervision (Training-Only Auxiliary Branch):
#      Bridges dense one-to-many supervision and NMS-free one-to-one inference;
#      stripped completely during fuse()/export at zero deployment overhead.
# =============================================================================

nc: 19
end2end: True
reg_max: 16
scales:
  n: [0.50, 0.25, 1024] # ~2.74M fused params, ~7.00 GFLOPs (@ nc=19)
  s: [0.50, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2   (320x320)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4   (160x160)
  - [-1, 2, C3k2, [320, False, 0.25]]  # 2-P2/4   widened early high-res stage (256 -> 320, 80 ch on n)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8   (80x80)
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-P3/8   small-object feature stage
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16  (40x40)
  - [-1, 2, C3k2, [512, True]]         # 6-P4/16  1:1 aligned with yolo26n.pt
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32  (20x20)
  - [-1, 2, C3k2, [1024, True]]        # 8-P5/32  deep semantic stage
  - [-1, 1, SPPF, [1024, 5, 3, True]]  # 9-P5/32  multi-scale receptive field pooling
  - [-1, 2, C2PSA, [1024]]             # 10-P5/32 position-sensitive spatial attention

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                  # 12: cat backbone P4/16
  - [-1, 2, C3k2, [512, True]]                 # 13: top-down P4 fusion

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                  # 15: cat backbone P3/8
  - [-1, 2, C3k2, [288, True]]                 # 16: P3/8-fine output (widened: 256 -> 288, 72 ch on n)

  - [-1, 1, Conv, [288, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]                 # 18: cat neck P4/16
  - [-1, 2, C3k2, [512, True]]                 # 19: P4/16-medium output (1:1 aligned with yolo26n.pt)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]                 # 21: cat backbone C2PSA P5/32
  - [-1, 1, C3k2, [1024, True, 0.5, True]]     # 22: P5/32-coarse output (1:1 aligned with yolo26n.pt)

  - [[16, 19, 22], 1, Detect, [nc]]            # 23: Upgraded to YOLO27Detect (+ FG Alignment)
