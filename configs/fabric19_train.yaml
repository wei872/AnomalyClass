# 训练超参 (均有工业默认值, 一般无需改动; 命令行可覆盖)
input_size: 448          # 必须为 14 的倍数; 448=32x32 patch, 实时性与小缺陷的平衡点
emb_dim: 128             # 度量嵌入维度 (开集分类头)
epochs: 60
batch: 8                 # 单卡 batch; 有效 batch = batch * accum
accum: 4
lr: 6.0e-4               # 头部/颈部 lr (骨干 = lr * backbone_lr_ratio)
backbone_lr_ratio: 0.1
weight_decay: 0.05
warmup_epochs: 1
freeze_epochs: 6         # 前 N epoch 冻结骨干 (预训练特征先适配任务), 之后解冻端到端微调
ema_decay: 0.9995
amp: auto                # auto/cuda 时启用混合精度
eval_every: 5
crop_jitter: [0.55, 1.3] # 训练裁窗 = 部署tile物理尺度 x jitter, 保证训练/部署尺度一致
# 损失权重
obj_w: 1.0
giou_w: 1.0
l1_w: 0.5
cls_w: 1.0
supcon_w: 0.3
focal_gamma: 2.0
focal_alpha: 0.5
# 推理/标定
tile: 448
overlap: 0.25
nms_iou: 0.45
# 其他
seed: 42
num_workers: 8
out_dir: runs/fabric19
backbone_ckpt: auto      # auto=缓存/自动下载官方 DINOv2; 或本地 .pth; scratch=随机初始化
