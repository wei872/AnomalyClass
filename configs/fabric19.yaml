# 19 类有监督区域分类。类别顺序始终以 dataset/fabric19.yaml 为准。
data:
  dataset_config: ../dataset/fabric19.yaml
  prepared_root: data/processed/fabric19
  # 可在预处理命令中用 --data-root 覆盖原 YAML 的 Windows 根目录。
  padding: 0.1
  min_crop_size: 0.1

mode: supervised
model:
  backbone: dino_vits8         # 默认轻量版 DINO DeiT-S/8
  pretrained_path: null       # null 自动下载 dino_deitsmall8_pretrain.pth；也可填本地同名权重路径
  image_size: 224
  grad_from_block: 11
  mask_layers: 9
  n_heads: 4
  n_views: 2
  hidden_dim: 2048
  bottleneck_dim: 256

training:
  batch_size: 8               # 每个样本另有两个视图；按显存调整
  accumulation_steps: 2
  num_workers: 4
  persistent_workers: false   # true 可复用 worker，Windows/spawn 下大幅提速；
                              # 代价：worker RNG 只初始化一次，续训的增强随机流与 false 时不同
                              # （采样顺序不受影响，仍由主进程 generator 决定）
  epochs: 50
  lr: 0.003
  min_lr: 0.000003
  momentum: 0.9
  weight_decay: 0.00005
  amp: true                  # 仅 CUDA 生效
  class_balanced_sampler: false
  max_grad_norm: 0            # 0 表示不裁剪梯度
  eval_every: 1              # 仅用于观察；监督 best.pt 按 val macro-F1 保存

loss:
  sup_weight: 0.3             # NCD 的已知类分支权重
  supcon_weight: 0.1          # 有监督模式的 SupCon 辅助权重
  memax_weight: 4.0
  temperature: 0.1
  contrastive_temperature: 1.0
  supcon_temperature: 0.07
  teacher_temp: 0.04
  warmup_teacher_temp: 0.07
  warmup_teacher_temp_epochs: 40

detector:
  model: yolov8n.pt              # 轻量 YOLO 检测器；离线可用 --detector-weights
  model_yaml: yolov8n.yaml       # 仅 --allow-random-init 测试用
  weights: null
  image_size: 640
  epochs: 100
  batch_size: 16
  class_agnostic: true           # 只检测 defect/normal，不读取新类 ID
  conf_threshold: 0.25
  iou_threshold: 0.45
  anomaly_threshold: 0.25        # 图像异常分数阈值

# 仅用正常图训练的 DINO patch 特征库 -> 像素级异常图 -> 自适应二值化 -> 掩码。
# 这是未知类别检出能力的来源：特征库里没有任何缺陷，所以没见过的缺陷也会偏离正常分布。
anomaly:
  enabled: true
  image_size: 448             # 比分类用的 224 更高，小缺陷定位更准；必须能被 patch_size 整除
  layers: [3, 5, 7]           # DINO 中层特征，兼顾纹理与语义
  neighborhood: 3             # patch 网格局部平均，抑制单点噪声（奇数）
  bank_size: 8192             # coreset 后保留的正常特征数
  max_candidates: 40000       # coreset 前的随机降采样上限
  coreset: true               # 贪心 k-center；设为 false 则随机采样（快，覆盖略差）
  knn: 3                      # 每个 patch 取 k 近邻平均距离
  smooth_sigma: 4.0           # 异常图高斯平滑（原图像素单位）
  topk_ratio: 0.01            # 图像分数 = 最高 1% patch 距离的均值，比单点 max 稳
  min_area: 24                # 小于该像素面积的连通域视为噪声
  max_area_ratio: 0.35        # 超过全图 35% 的连通域是阈值失败，不是缺陷
  max_regions: 20
  threshold_steps: 24         # MEBin 式阈值扫描步数
  score_threshold: 1.0        # 归一化图像分数阈值；1.0 = 正常图上界（由 normalval 标定）
  fuse_iou: 0.3               # 与 YOLO 框的融合 IoU 阈值

inference:
  area_temperature: 50.0
  image_threshold: null       # null: 每图 top-1；设为 0~1 数值则多标签输出

discovery:
  known_class_ids: null       # NCD 必须显式指定；见 fabric19_ncd.yaml

experiment:
  seed: 3407
  device: auto
  output_dir: outputs/fabric19_supervised
  print_freq: 10
