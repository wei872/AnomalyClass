# AnomalyClass 推荐设置参考 (数据路径见 dataset/fabric19.yaml, 不要改这里)
# 所有脚本的默认参数已与本文件一致, 四条命令直接运行即可:
#   1) python scripts/train_detector.py   --data-yaml dataset/fabric19.yaml --out checkpoints/detector   # 正/异常检测器 (训练末尾自动 kNN+融合 -> model_final.pth)
#   2) python scripts/calibrate.py        --data-yaml dataset/fabric19.yaml                             # 校准阈值 (默认 --sweep), 写 checkpoints/detector/thresholds.json
#   3) python scripts/train_classifier.py --data-yaml dataset/fabric19.yaml --out checkpoints/classifier # 缺陷分类器
#   4) python scripts/infer.py            --data-yaml dataset/fabric19.yaml --input <图片/目录/视频> --out runs/infer

detector:                      # 正异常检测器 (Dinomaly2): 正常图 + 带框缺陷图联合训练, 固定 448
  backbone: dinov2reg_vit_small_14   # 1660@448 实时; 更准可换 dinov2reg_vit_base_14
  image_size: 448              # 推理输入尺寸 (训练/校准/推理必须一致, 勿改)
  crop_size: 448              # = image_size, 不裁边缘 (图四周暗角属于正常, 必须训练到)
  total_iters: 10000           # 1660 上 bs=16 约 2s/iter -> 10000 约 5.5h; 断点续训 --resume model_last.pth
  batch_size: 16
  local_loss_w: 1.0            # 默认 1.0, 细长经线类缺陷需要 (局部逐位置损失, 避免全局cosine稀释细线信号)
  hard_pos_ratio: 0.2          # 配合 local_loss_w 的 hard mining 比例 (如 0.2)
  margin_w: 1.0                # 缺陷监督-图级hinge: 缺陷图分数须比同batch正常图高 margin (联合训练默认开)
  margin: 0.05                 # margin 目标间隙 (cos距离量级)
  box_margin_w: 1.0            # 缺陷监督-框级hinge: 框内token平均距离 >= margin, 抬高 min_defect
  hard_normal_w: 0.5           # 困难正常重加权: 压 max_normal
  enc_fp16: false              # 冻结 encoder 用 fp16 autocast (CUDA), 省约一半 encoder 耗时, 需在1660上实测
  early_stop: 0                # 连续N次评估 model_best 未提升就提前结束 (0=关)
  local_loss_warmup: 2000      # 局部损失线性预热 iters (0=不预热)
  defect_frac: -1              # 每batch缺陷图期望占比: -1=自动(自然占比<20%时抬到25%) / 0=自然 / 0.25=指定
  optimizer: stableadamw      # 官方配方 (RMS限幅+NaN跳步); adamw=旧行为
  lr_final_ratio: 0.0          # 余弦退火终点=lr*该值: 0=退火到0(默认) / 1=恒定(官方默认)
  flip: true                   # 随机翻转增强 (--no-flip 关); 官方2D配方=无增强 (rot90/flip 都关)
  rot90: false                 # 训练增强的随机90°旋转, 默认关 (--rot90 开, 方向不固定的布匹才开). 布匹经纬方向固定时建议关, 细长经/纬线缺陷更敏感
  margin_score: smooth         # 图级hinge用的分数: smooth=与推理/校准同款(上采样+高斯平滑后取最大) / token=旧做法
  defect_bg_w: 0.5             # >0: 缺陷图框外token(正常纹理)也参与重建
  smooth_sigma: 4.0            # 异常图平滑; >4 时核宽随sigma增长. 改后须重训/重校准, thresholds.json 会记录供推理沿用
  eval_interval: 2500          # 训练中评估间隔: val缺陷图 + normalval正常图, 按 (I-AUROC, 相对间隙) 选 model_best
  half: false                  # GTX 1660 上可开 true (FP16, 约 2x 加速)
  # 推理顺序: 先检测区域 -> 再分类 (见 segmentation/classifier); --no-defect-sup 仅消融对照

calibration:                   # 阈值校准: normalval 正常分数 vs val 缺陷分数, 可分时取间隙中点
  sweep: true                  # 推荐: calibrate --sweep 自动扫 smooth_sigma×score_ratio, 取正常/缺陷间隙最大者
  score_ratio: 0.0             # 图级分数: 0=最大值; 0.01=最高1%像素均值(官方评估); sweep/--score-ratio 会写入 thresholds.json
  pix_quantile: 0.9999         # 正常图异常像素分位数 -> 区域分割阈值 pix_thr
  # 若正常/缺陷分数重叠 (无法同时 100%), 会告警并取 max_normal; 那时需要重训检测器让分布分开

segmentation:                  # 异常图 -> 区域框 -> 只对最异常的 top_k 个做分类
  mask_ratio: 0.5              # 掩码阈值 = mask_ratio * pix_thr
  region_score_ratio: 0.5      # 掩码阈值还取 max(全局阈值, 图内最高分*该比例), 只圈最热区域
  top_k: 1                     # 只对最异常的 top_k 个区域做分类 (0=全部); 其余标未知类型
  min_area_ratio: 0.0002       # 最小区域面积 (占图比例)
  dilate: 7                    # 连通域前膨胀核大小
  box_pad: 0.3                 # 检测框向外扩展比例 = 分类器训练裁剪 crop_pad, 两者一致

knn_detector:                  # 训练末尾自动建的 kNN 记忆库 (train_detector.py --knn-*; --no-knn 关): DINOv2 中层 patch 记忆库, 几分钟建好
  layer_sets: "5,7,9;3,5,7"    # encoder 的 0-based 层 (逗号=多层平均, 分号=多组候选, 按 val 间隙择优)
  bank_size: 20000             # coreset 大小; 推理最近邻搜索耗时 ∝ bank_size
  max_images: 300              # 最多用多少张正常图建库

fusion:                        # Dinomaly + kNN 融合 (训练末尾自动做, 写 model_final.pth): 共用 encoder, w 在 val 上自动选; 融合后必须 calibrate (命令 2)
  weights: "0,0.25,0.5,0.75,1"  # 候选的 Dinomaly 权重; 1=纯Dinomaly 0=纯kNN 都是候选, 不会比单个差

classifier:                    # 缺陷分类器 (在 YOLO 疵点框裁剪上训练, letterbox 保宽高比)
  kind: embed                  # embed=冻结DINOv2嵌入+余弦头+Balanced Softmax (默认, 小样本/不均衡友好, 几分钟) / cnn=旧方案端到端微调
  backbone: dinov2reg_vit_small_14   # [embed] 与检测器共用权重文件
  views: 4                     # [embed] 每个裁剪至少抽几个视角 (1干净+其余增强)
  min_per_class: 200           # [embed] 稀有类按此目标多抽增强视角 (特征级过采样, 最多16个)
  tau: 1.0                     # [embed] logit adjustment 强度: 1=Balanced Softmax, 0=普通CE
  head_epochs: 200             # [embed] 分类头轮数 (特征已缓存, 秒级)
  arch: mobilenet_v3_small     # [cnn] 最轻量
  crop_size: 224               # letterbox 目标尺寸, 训练与推理一致 (不用调)
  crop_pad: 0.3                # 训练裁剪四周扩展比例 (与检测区域 box_pad 一致)
  epochs: 50                   # 配合早停 patience=15
  batch_size: 32
  box_jitter: 0.3              # 训练裁剪对GT框随机缩放/平移, 模拟检测器给出的框 (0=关)
  rot90: false                 # 90°旋转增强默认关: 经线/纬线类别靠方向区分 (--rot90 打开)
  balance_power: 1.0           # 类别均衡仅用加权采样(权重∝n_c^-power), 损失不再加权; 1=完全均衡 0=自然分布
  unknown_thr: auto            # 按 val 最大概率分位数自动校准 (clamp 0.5~0.8), 低于此判 "未知类型"
