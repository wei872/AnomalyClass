# =============================================================================
# FabricNCD 训练配置 — 布匹 19 类疵点
#
# 数据路径沿用 dataset/fabric19.yaml. 如果该 yaml 里仍是 Windows 绝对路径
# (D:/tyhn/...), 把下面 data.root 设成本机数据集根目录即可自动重映射:
#   data.root: /data/fabric/source5_augmenteds
# =============================================================================
experiment:
  name: fabric19_fabricncd_s
  output_dir: runs/fabric19_fabricncd_s
  seed: 42
  device: auto          # auto | cuda | cpu | mps
  amp: true             # 仅 CUDA 生效

data:
  dataset_yaml: dataset/fabric19.yaml
  root: null            # 覆盖/重映射数据集根目录
  # ---- 输入分辨率 (整图缩放到该尺寸, 不切块) ----
  # ⚠ image_size 一律是 **[高, 宽] = (H, W)**, 不是 [宽, 高].
  #   你的原图是 1600(宽) x 846(高), 写死的话应写 [832, 1600]; 写成 [1600, 832] 或被当成
  #   横竖互换, 整幅图会被压扁, 经纬比例与算力预算全错.
  # auto (默认, 推荐): 读数据集原图的真实 (H, W), 保持长宽比把短边缩到 short_side,
  #   且**默认不放大**. 1600x846 的原图 -> 输入 [832, 1600] (长宽比 1.89:1 不变).
  # 常用档位 (短边 / GMACs / 本机 2 核 CPU 单张):
  #   [416, 800]   0.79 GMACs, 0.15 s   只有 CPU / 冒烟
  #   [512, 960]   1.16 GMACs, 0.27 s
  #   [640, 1216]  1.84 GMACs, 0.35 s   轻量
  #   [832, 1600]  3.14 GMACs, 0.68 s   默认 = 原图分辨率, 不丢细节
  # 不要写 [832, 832] 这类正方形: 会把 1.89:1 拉平, 经纬各向异性这个最强线索就废了.
  image_size: auto
  short_side: 1024       # auto 时短边的目标像素数; 原图短边 846 < 1024 时默认不放大
  max_scale: 1.0         # 允许的最大放大倍数; 想超采样小疵点可设 1.2 (算力 ×1.4)
  # 实测显存 (训练含反向): 832x1600 约 1.05 GB/张 -> bs=4 约 4.2 GB (6 GB 的 1660 够用)
  # 若放大到 [1024, 1952] (max_scale 1.21), 显存 ×1.47, 请把 batch_size 降到 2
  batch_size: 4
  eval_batch_size: 2
  num_workers: 4
  normal_ratio: 0.4     # 每个 batch 中正常图比例 (正常图越多, 记忆库越稳)
  mask_dir: null        # 可选: 真实布面/背景掩码目录 (文件名与图片一致)
  mask_work_size: auto  # 布面掩码估计的长边尺寸: auto = 按实测经纬周期自动定
                        # (周期 6 px 的细密布只能缩到 ~1/2, 周期 20 px 可缩到 1/5)
  limit_train: null
  limit_val: null

  augment:
    crop_mode: scale        # scale = 整图缩放 (默认, 与本配置的大图输入一致)
                            # native = 原像素尺度裁块 (仅当疵点小于 3 px 时可选, 默认不用)
    crop_scale: [0.85, 1.15]
    scale: [0.5, 1.0]       # 随机缩放裁剪
    hflip: 0.5
    vflip: 0.5
    rot90: 0.25
    rotate: 3.0             # 小角度旋转 (度)
    color_jitter: 0.3
    width_margin: 0.3       # 布幅增广: 最大边距比例
    # 各向异性拉伸: 数据集长宽比常常不统一 (实测 1.88~2.42), 整图缩放到同一输入会被各自拉伸;
    # 这里是"让模型见惯各种拉伸比例", 不是在制造畸变 —— 参数范围对应 ±15% 左右的形变
    aspect_jitter: [0.85, 1.18]
    aspect_prob: 0.5
    weave_norm: true        # 织造尺度归一化 (跨布种泛化关键)
    target_period: 8.0
    synth_prob: 0.5         # 合成疵点概率
    synth_types: [scratch, stain, cutpaste, weave_shift, missing_yarn, foreign_fiber]
    synth_max_ops: 2

model:
  backbone:
    arch: mobilenet_v3_small   # 轻量首选; 精度优先可换 mobilenet_v3_large
    pretrained: true
    freeze_stages: 1           # 冻结浅层, 降低小数据过拟合
  texture:
    channels: 32
    orientations: [0, 45, 90, 135]
    wavelengths: [4.0, 8.0]
    kernel_size: 15
    use_imaginary: true        # 相位响应 -> 感知经纬错位
    use_weave_norm: true
  neck:
    channels: 96
    global_channels: 96
    dilations: [2, 4]
    attention_heads: 4
    use_attention: true
  fabric_mask:
    enabled: true
    pool_sizes: [3, 7, 15, 31, 63]
    use_xy: false              # 用 "到布边距离" 而非绝对坐标
    border_prior: true         # 额外送入"到画面边框距离": 整幅都是布 (无辊筒/台面) 时
                               # 布面概率图恒为 1, 只剩这条先验能告诉模型布边在哪
  heads:
    embed_dim: 64
    num_classes: 19
    proto_temperature: 0.1
    anomaly_mid: 32
    # 异常图尺度: 8 = 标准 (1/8 特征); 4 = 把异常头挂到 1/4 (融合特征上采样 + 纹理).
    # 本地 A/B 实测 4 更差 (pAUROC 0.62 -> 0.40): 多出来的只是纹理噪声, 分辨率不足
    # 时请优先用 tools/eval_scales.py 判断要不要整体提分辨率, 而不是只换这一层.
    anomaly_stride: 8
  memory:
    enabled: true
    capacity: 2048
    score_weight: 0.35
    distance_scale: 0.08      # 正常 patch 到记忆库的典型余弦距离, 用于归一化
  loss:
    # pseudo_ratio: 框是弱标注(只框住疵点), 直接把整框当像素真值会让异常头"刷满矩形".
    # 用记忆库距离在框内保留 top-k 比例像素作正样本, 其余框内像素忽略; 0 或 >=1 = 关闭.
    # pseudo_ratio: 用记忆库距离把"整框"正样本收缩成异常核心. 本地 A/B (小疵点+大框)
    # 实测反而掉点 (pAUROC 0.62 -> 0.45): 记忆库还不准时, 收缩会把真实疵点像素也丢掉.
    # 默认关闭; 只有当框显著大于疵点、且记忆库已经很稳时才建议开到 0.3 试试.
    anomaly: {focal_weight: 1.0, dice_weight: 1.0, gamma: 2.0, alpha: 0.65, pseudo_ratio: 0.0}
    fabric: {bce_weight: 0.5, dice_weight: 0.5, edge_weight: 0.5}
    cls: {weight: 1.0, label_smoothing: 0.05, box_shrink: 0.9}
    supcon: {weight: 0.5, temperature: 0.1}
    compact: {weight: 0.1}

train:
  epochs: 60
  warmup_epochs: 3
  lr: 0.0005
  backbone_lr: 0.0001
  weight_decay: 0.05
  grad_clip: 5.0
  ema: 0.999
  val_interval: 1
  log_interval: 10
  early_stop_patience: 15
  memory_warmup_batches: 50
  memory_refresh_interval: 5
  score_weights: {pixel_auroc: 0.35, pro: 0.15, image_auroc: 0.20, map50: 0.10, map50_agnostic: 0.10, f1_macro: 0.10}

eval:
  # 整图输入 (1600x846, 宽x高) 保持 tile=false: 与训练一致; 仅在显存/耗时受限
  # 而必须切块推理时才置 true (此时训练也应改用 augment.crop_mode=native)
  tile: false
  tile_size: null           # null = 等于 data.image_size; 切块时同样按 [高, 宽] 写
  tile_overlap: 128
  tile_batch: 2
  max_pixels: 3.0e5         # 像素级指标统计前下采样到的像素数上限 (内存保护)
  threshold: null        # null = 自适应阈值
  threshold_sigma: 3.0
  min_area_ratio: 0.0004
  merge_strategy: area_weighted   # area_weighted | top1 | max
  calib_sigma: 6.0                # 阈值 = max(正常集999分位, 均值+kσ)
  peak_ratio: 0.35                # 区域主元素筛选: 保留峰值 >= thr+ratio*(max-thr)
  open_radius: 1
  bbox_refine_ratio: 0.7          # 用高分核心收缩区域框
  min_cls_score: 0.0
  # 图像级分数: 优先用固定像素数 (k_pixels), 而非比例. 1% 在 800x1952 上等于
  # 一万五千像素, 而小疵点常常只有一两千像素 -> 均值被正常像素稀释, 图像级
  # AUROC 会掉到 0.5 以下. 256 个像素与疵点尺度无关, 更适合小疵点.
  topk_pixels: 256
  topk_ratio: 0.01        # 仅在 topk_pixels 未设置时生效
  calib_interval: 1       # 每几轮用正常图重新校准阈值; 设成 >= epochs 即等于只在启动时校准
  calib_batches: 4        # 重新校准时用几个 batch 的正常图 (越多越稳, 越慢)

infer:
  tile: false              # 1600x846 整图一次前向 (tile=true 才切块, 更慢, 一般不开)
  tile_size: null          # null = 等于 data.image_size
  tile_overlap: 128
  tile_batch: 2

  # ---------------- 实时推理 (1660 级显卡冲 40 FPS) ---------------- #
  out_stride: 4            # 输出分数图下采样倍数: 4 => 1600x846 只算到 400x208
                           # 定位框最细量化到 4 px (0.3%), 但对区域检出没有影响
  probs_mul: 2             # 类别概率图再降一档 (只用于区域平均, 不影响定位)
  fp16: true               # CUDA 上 FP16 推理 (1660 无 Tensor Core 也有 ~1.5x)
  prep_gpu: true           # resize + 归一化放到 GPU (省 5~8 ms/张 CPU)
  channels_last: true      # NHWC + cudnn, 对 MobileNet 类深度可分离卷积更快
  weave_interval: 30       # 每 N 帧重估一次织造周期 (FFT 不必每帧都做)
  memory_stride: 2         # 记忆库查询前 2x 平均池化 (乘加量降 4 倍)

  image_score_threshold: 0.5
