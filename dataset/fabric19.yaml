# =============================================================================
# 布匹缺陷数据集 (19 类). 类别名与 dataset/dataset.yaml 完全一致。
# 路径失效(如别人机器的 D:/ 盘符)无需改本文件:
#   python train.py --data dataset/fabric19.yaml --data-root /你的数据集根目录
#   或设置环境变量 FABRIC19_ROOT=/你的数据集根目录  (根目录下含 images/ labels/ normal/)
# TODO: 也可以把下面四个路径改成你机器上的实际路径 (原 yaml 中是 Windows 路径:
#   D:/tyhn/yolo/dataset/source5_augmented/... )
# 推荐目录结构:
#   DATASET_ROOT/
#     images/train/  images/val/            <- YOLO 图片
#     labels/train/  labels/val/            <- YOLO .txt (cls cx cy w h, 归一化)
#     normal/images/train/  normal/images/val/  <- 纯正常图, 无标签
# =============================================================================
path: D:/tyhn/yolo/dataset/source5_augmenteds/
train: D:/tyhn/yolo/dataset/source5_augmenteds/images/train
val: D:/tyhn/yolo/dataset/source5_augmenteds/images/val
normaltrain: D:/tyhn/yolo/dataset/source5_augmenteds/normal/images/train
normalval: D:/tyhn/yolo/dataset/source5_augmenteds/normal/images/val

nc: 19
names: ['纬线杂质', '断纬', '多股线', '纬线不直', '包边不重叠', '捻接器接头',
        '小尾巴', '经线毛球', '包边不良', '手工接头', '纬斜', '短废纱线',
        '单根包不进', '棉团', '蚊虫小黑点', '小布头', '稀缝', '油点线', '飘絮']