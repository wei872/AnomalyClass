# =============================================================================
# 布匹缺陷数据集配置 (19 类). 所有脚本通过 --data-yaml 读取本文件.
# 把下面五个路径改成你机器上的实际路径 (也可以不改, 运行时加 --root <数据根目录> 或设环境变量 FABRIC19_ROOT 覆盖 path).
#
# 目录结构:
#   DATASET_ROOT/
#     images/train/  images/val/                <- 带疵点的图 (YOLO 图片)
#     labels/train/  labels/val/                <- YOLO .txt (cls cx cy w h, 归一化)
#     normal/images/train/  normal/images/val/  <- 纯正常图, 无标签 (normalval 必须配置)
# =============================================================================
path: D:/tyhn/yolo/dataset/source5_augmented/
train: D:/tyhn/yolo/dataset/source5_augmented/images/train
val: D:/tyhn/yolo/dataset/source5_augmented/images/val
normaltrain: D:/tyhn/yolo/dataset/source5_augmented/normal/images/train
normalval: D:/tyhn/yolo/dataset/source5_augmented/normal/images/val

nc: 19
names:  ['纬线杂质', '断纬', '多股线', '纬线不直', '包边不重叠', '捻接器接头', '小尾巴', '经线毛球', '包边不良', '手工接头', '纬斜', '短废纱线', '单根包不进', '棉团', '蚊虫小黑点', '小布头', '稀缝', '油点线', '飘絮']